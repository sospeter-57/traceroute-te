name: Traceroute Web Application

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "iracus" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: install dependencies
      run: npm i

    - name: run tests
      run: npm test


  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      - name: build
        run: npm run build

